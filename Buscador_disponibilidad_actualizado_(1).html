function render(){expire();$('who').innerHTML='<span>Ana<small>Reservas</small></span><b class="userBadge">A</b>';$('drawer').innerHTML=routes.map(n=>btn(e(n),'go('+JSON.stringify(n)+')')).join('');app.innerHTML='<div class="title between"><h1>'+e(page==='Disponibilidad'?'Buscar disponibilidad':page)+'</h1>'+(page==='Disponibilidad'?'<div class="row"><small>Moneda</small>'+units()+'</div>':'')+'</div>'+(page==='Disponibilidad'?availability():ratesHub())}
let search={a:'2027-01-10',b:'2027-01-15',ad:2,kids:2,pets:1,zone:'Todas',rooms:0,sea:0,total:null,night:null,amen:[],view:'Tarjetas',span:14,sort:'Menor precio'};
const endBlock=b=>b.reason==='Arreglo mayor'&&!b.released?'9999-12-31':b.b;
function blocked(p,a,b,skip){return D.blocks.some(x=>x.p===p&&over(a,b,x.a,endBlock(x)))||D.rs.some(r=>r.id!=skip&&r.p===p&&r.status==='Confirmada'&&over(a,b,r.a,r.b))||D.tasks.some(t=>t.history&&t.p===p&&over(a,b,t.a,t.b))}
function pending(p,a,b,skip){return D.rs.filter(r=>r.id!=skip&&r.p===p&&r.status==='Pendiente'&&over(a,b,r.a,r.b))}
function quote(p,a,b,pets=0,garage=false){let nightsCount=Math.max(1,nights(a,b)),lodging=0;for(let i=0;i<nightsCount;i++)lodging+=p.rates?.[dayAdd(a,i)]??p.rate;let {clean,service}=p.charges,pet=pets*p.charges.pet,park=garage?p.charges.garage:0;return {lodging,clean,service,pet,park,total:lodging+clean+service+pet+park}}
function quoteInfo(q,count){return kv('Alojamiento · '+count+' noches',viewMoney(q.lodging))+kv('Limpieza',viewMoney(q.clean))+kv('Servicio de check-in/out',viewMoney(q.service))+(q.pet?kv('Mascotas',viewMoney(q.pet)):'')+kv('Total de la estadía',viewMoney(q.total-q.park))+kv('Promedio final por noche',viewMoney((q.total-q.park)/count))+(q.park?kv('Cochera solicitada',viewMoney(q.park))+kv('Total con cochera',viewMoney(q.total)):'')}
function availability(cal=false){let s=search;let filtered=D.props.filter(p=>p.cap>=s.ad+s.kids&&p.pets>=s.pets&&(s.zone==='Todas'||p.zone===s.zone)&&p.bedrooms>=s.rooms&&(!s.sea||p.sea<=s.sea)&&s.amen.every(x=>p.amen.includes(x))).map(p=>({p,q:quote(p,s.a,s.b,s.pets),conf:blocked(p.id,s.a,s.b),partial:Array.from({length:nights(s.a,s.b)},(_,i)=>!blocked(p.id,dayAdd(s.a,i),dayAdd(s.a,i+1))).filter(Boolean).length})).filter(z=>(s.total==null||z.q.total<=s.total)&&(!s.minTotal||z.q.total>=s.minTotal)&&(!s.minNight||z.q.total/nights(s.a,s.b)>=s.minNight)&&(s.night==null||z.q.total/nights(s.a,s.b)<=s.night)).sort((x,y)=>Number(x.conf)-Number(y.conf)||y.partial-x.partial||(s.sort==='Menor precio'?x.q.total-y.q.total:y.q.total-x.q.total));let calendar=cal||s.view==='Calendario';let results=cal?D.props.map(p=>({p,q:quote(p,s.a,s.b,s.pets)})):filtered.filter(z=>calendar||!z.conf);return searchTop(cal)+(calendar?'<div class="bar">'+btn('Hoy','calendarOffset=today;render()')+tabs(['14 días','Mes completo'],s.span===14?'14 días':'Mes completo','setSpan')+btn('‹ Anterior','shiftCalendar(-1)')+btn('Siguiente ›','shiftCalendar(1)')+'</div>':'<div class="between bar"><h2>'+results.length+(results.length===1?' alojamiento disponible':' alojamientos disponibles')+'</h2>'+sel('Ordenar','sort',['Menor precio','Mayor precio'],s.sort,'onchange="search.sort=this.value;render()"')+'</div>')+(calendar?calendarGrid(results,cal):'<div class="cards">'+results.map(({p,q})=>'<article class="card"><div class="photoWrap"><img class="cover" src="'+p.img+'" alt="Interior de alojamiento de muestra"><div class="photoTags">'+[...(p.pets?['Admite mascotas']:[]),...p.amen.slice(0,2)].map(x=>'<span>'+e(x)+'</span>').join('')+'</div></div><h2>Departamento '+e(p.name)+'</h2><small>'+e(p.zone)+' · Hasta '+p.cap+' huéspedes · '+p.rooms+' ambientes</small>'+kv('Total por '+nights(s.a,s.b)+' noches',viewMoney(q.total))+kv('Promedio final por noche',viewMoney(q.total/nights(s.a,s.b)))+(p.amen.includes('Cochera')?kv('Cochera opcional',viewMoney(p.charges.garage)):'')+'<small>Depósito reembolsable aparte · '+viewMoney(p.guarantee??100)+'</small>'+(pending(p.id,s.a,s.b).length?pill(pending(p.id,s.a,s.b).length+' pendientes'):'')+btn('Ver detalle','quoteDetail('+p.id+')','full')+'</article>').join('')+'</div>')+(!results.length?empty('No hay alojamientos para estos filtros.'):'')}
function searchGo(ev){ev.preventDefault();let f=new FormData(ev.target),a=f.get('a'),b=f.get('b');if(b<=a||nights(a,b)>366){toast('Elegí una estadía entre 1 y 366 noches.');return}Object.assign(search,{a,b,ad:+f.get('ad'),kids:+f.get('kids'),pets:+f.get('pets'),zone:f.get('zone')});render()}function setSpan(v){calendarOffset=null;search.span=v==='14 días'?14:31;render()}function shiftCalendar(n){let anchor=calendarOffset||search.a;calendarOffset=search.span===14?dayAdd(anchor,14*n):monthJump(anchor,n);render()}function switchView(v){search.view=v;render()}
function calendarGrid(rs,master){let anchor=calendarOffset||search.a,start=search.span===14?anchor:anchor.slice(0,7)+'-01',count=search.span===14?14:new Date(+start.slice(0,4),+start.slice(5,7),0).getDate(),ds=Array.from({length:count},(_,i)=>dayAdd(start,i));return box('Disponibilidad · '+fmt(start)+' al '+fmt(ds.at(-1)),'<p>Libre · Ocupado por reserva · Bloqueado por Oficina. El contorno indica las noches consultadas.</p>'+table(['Departamento',...ds.map(fmt),'Total estadía','Pendientes',''],rs.map(({p,partial})=>[e(p.name)+'<small>'+partial+' de '+nights(search.a,search.b)+' noches libres</small>',...ds.map(d=>{let b=D.blocks.find(x=>x.p===p.id&&over(d,dayAdd(d,1),x.a,endBlock(x))),busy=blocked(p.id,d,dayAdd(d,1));return '<span class="'+(busy?'busy':'free')+(d>=search.a&&d<search.b?' chosenNight':'')+'" title="'+e(b?.reason||d)+'">'+e(b?'Bloqueado · '+b.reason:(busy?'Ocupado':master?money(p.rates?.[d]??p.rate):'Libre'))+'</span>'}),(blocked(p.id,search.a,search.b)?'Disponibilidad parcial':viewMoney(quote(p,search.a,search.b,search.pets).total)),pending(p.id,search.a,search.b).length,btn('Ver detalle','quoteDetail('+p.id+')')])))}
function moreFilters(){
 let factor=unit==='ARS'?D.rate:1;
 const limits=[['minTotal','Presupuesto total mínimo'],['total','Presupuesto total máximo'],['minNight','Promedio final mínimo por noche'],['night','Promedio final máximo por noche']];
 const amenities=[...new Set([...D.props.flatMap(p=>p.amen),'Calefacción','Parrilla','Vista al mar','Lavarropas','TV','Ascensores','Cocina'])];
 const priceRange=(title,lo,hi)=>'<fieldset class="priceRange"><legend>'+title+'</legend>'+['Desde','Hasta'].map((word,i)=>{const k=i?hi:lo;return inp(word,k,'number',search[k]==null?'':rnd(search[k]*factor),'min="0" step="any" placeholder="'+word+' '+unit+'"')}).join('')+'</fieldset>';
 modal('Más filtros','<div class="filterCurrency">'+sel('Moneda','filterCurrency',['USD','ARS'],unit)+'</div><div class="filterGrid">'+sel('Zona','zone',['Todas',...new Set(D.props.map(p=>p.zone))],search.zone)+inp('Habitaciones mínimas','rooms','number',search.rooms||'','min="0" placeholder="Cualquiera"')+priceRange('Presupuesto total de la estadía','minTotal','total')+inp('Distancia máxima al mar (m)','sea','number',search.sea||'','min="0" placeholder="Sin límite"')+priceRange('Precio promedio final por noche','minNight','night')+'</div><h3>Comodidades</h3><div class="amenities">'+amenities.map((a,i)=>tick(a,'am'+i,search.amen.includes(a))).join('')+'</div><small>El presupuesto incluye alojamiento, limpieza, servicio y mascotas. Cochera y garantía aparte.</small>',()=>{
 for(const [low,high] of [['minTotal','total'],['minNight','night']])assert(value(high)===''||Number(value(high))>=Number(value(low)),'El máximo debe ser igual o mayor que el mínimo.');
 for(const [k] of limits)search[k]=value(k)===''?null:Number(value(k))/factor;
 Object.assign(search,{rooms:+value('rooms'),sea:+value('sea'),zone:value('zone'),amen:amenities.filter((_,i)=>check('am'+i))});draftSearch=null;
 },'Mostrar disponibilidad');
 form.elements.filterCurrency.onchange=()=>{const next=form.elements.filterCurrency.value==='ARS'?D.rate:1;for(const [name,label] of limits){const el=form.elements[name];if(el.value!=='')el.value=rnd(Number(el.value)*next/factor);el.placeholder=(name.startsWith('min')?'Desde ':'Hasta ')+form.elements.filterCurrency.value}factor=next};
 $('foot').insertAdjacentHTML('afterbegin',btn('Limpiar filtros','clearExtra()')+btn('Cancelar','closeModal()'));
}
function clearExtra(){Object.assign(search,{rooms:0,sea:0,zone:'Todas',minTotal:null,total:null,minNight:null,night:null,amen:[]});draftSearch=null;closeModal();render()}
const proposals=new Map();
function options(id){
  const key=JSON.stringify([id,search.a,search.b,search.ad,search.kids,search.pets]);
  if(!proposals.has(key))proposals.set(key,{garage:false,percent:10});
  return proposals.get(key);
}
const pesos=amount=>'$'+num(rnd(amount));
const quantity=(n,one,many)=>n+' '+(n===1?one:many);
const briefDate=s=>s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4);
async function copyText(text,message){
  try{await navigator.clipboard.writeText(text)}
  catch{
    const field=document.createElement('textarea');
    field.value=text;
    form.append(field);field.select();
    const copied=document.execCommand('copy');field.remove();
    if(!copied){$('error').textContent='El navegador impidió la copia. Seleccioná y copiá el mensaje.';const manual=document.createElement('textarea');manual.value=text;$('error').append(manual);manual.select();return}
  }
  toast(message);$('error').textContent=message;
}
function copyProposal(id){
 const p=prop(id),s=search,o=options(id),q=quote(p,s.a,s.b,s.pets,o.garage);o.agreed=q.total;
 const count=nights(s.a,s.b),base=q.total-q.park,ars=v=>pesos(v*D.rate);
 const lines=['*Departamento '+p.name+'*',p.zone+' · Mar del Plata','','Del '+briefDate(s.a)+' al '+briefDate(s.b),quantity(count,'noche','noches')+' · '+quantity(s.ad+s.kids,'persona','personas')+' · '+(s.pets?quantity(s.pets,'mascota','mascotas'):'Sin mascota'),'','*Total de la estadía: '+ars(base)+'*','Promedio por noche: '+ars(base/count),'Incluye alojamiento, limpieza, servicio de check-in/check-out'+(s.pets?' y mascota.':'.')];
 if(o.garage)lines.push('Cochera: '+ars(q.park),'Total con cochera: '+ars(q.total));
 else if(p.amen.includes('Cochera'))lines.push('Cochera opcional: '+ars(p.charges.garage));
 lines.push('','*Seña para reservar ('+o.percent+'%): '+ars(Math.ceil(q.total*o.percent/100))+'*','Depósito de garantía reembolsable: '+ars(p.guarantee??100)+'.','','Importes en pesos al día de hoy, sujetos a la cotización del dólar oficial.','Disponibilidad sujeta a confirmación al reservar.');
 return copyText(lines.join('\n'),'Cotización copiada');
}

let draftSearch=null,popType='',rangeStart='',rangeEnd='',rangeMonth='',calendarOffset=null;
const longDate=d=>new Date(d+'T12:00').toLocaleDateString('es-AR');
function searchDraft(){return draftSearch||(draftSearch=structuredClone(search))}
function compactField(title,val,kind,icon){return btn(ic(icon)+'<span><small>'+e(title)+'</small><b>'+e(val)+'</b></span>⌄','openSearchPop('+JSON.stringify(kind)+')','compactField')}
function barContent(){let d=searchDraft();return compactField('Entrada',longDate(d.a),'dates','cal')+compactField('Salida',longDate(d.b),'dates','cal')+compactField('Huéspedes',(d.ad+d.kids)+' huéspedes','guests','user')+compactField('Mascotas',d.pets?d.pets+' mascota'+(d.pets===1?'':'s'):'Sin mascotas','pets','home')+compactField('Zona',d.zone,'zone','building')+btn(ic('search')+'Buscar','applySearch()','primary')}
function applySearch(){Object.assign(search,searchDraft());draftSearch=null;calendarOffset=null;render()}
function monthGrid(first){let n=new Date(+first.slice(0,4),+first.slice(5,7),0).getDate(),offset=(new Date(first+'T12:00').getDay()+6)%7;return '<div><h3>'+e(new Date(first+'T12:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'}))+'</h3><div class="month">'+['Lu','Ma','Mi','Ju','Vi','Sá','Do'].map(x=>'<small>'+x+'</small>').join('')+'<i></i>'.repeat(offset)+Array.from({length:n},(_,i)=>{let d=dayAdd(first,i);return btn(i+1,'chooseRange('+JSON.stringify(d)+')',d===rangeStart||d===rangeEnd?'primary':d>rangeStart&&d<rangeEnd?'insideRange':'')}).join('')+'</div></div>'}
function monthJump(d,n){let m=new Date(d.slice(0,7)+'-01T12:00');m.setMonth(m.getMonth()+n);return date(m)}
function chooseRange(d){if(rangeEnd||!rangeStart||d<=rangeStart){rangeStart=d;rangeEnd=''}else rangeEnd=d;paintPop()}
function stepCount(k,v){let el=$('cnt'+k);el.textContent=Math.max(k==='ad'?1:0,Math.min(25,+el.textContent+v))}
function paintPop(){let d=searchDraft(),h=$('searchPop');if(!h)return;let step=(k,l)=>'<div class="between count"><b>'+l+'</b><div>'+btn('−',"stepCount('"+k+"',-1)")+' <b id="cnt'+k+'">'+d[k]+'</b> '+btn('+',"stepCount('"+k+"',1)")+'</div></div>';h.hidden=false;let body='';if(popType==='dates')body='<div class="between">'+btn('‹','rangeMonth=monthJump(rangeMonth,-1);paintPop()')+btn('›','rangeMonth=monthJump(rangeMonth,1);paintPop()')+'</div><div class="dualMonth">'+monthGrid(rangeMonth)+monthGrid(monthJump(rangeMonth,1))+'</div><small>'+e(rangeStart?longDate(rangeStart):'Seleccioná la entrada')+' — '+(rangeEnd?longDate(rangeEnd)+' · '+nights(rangeStart,rangeEnd)+' noches':'Seleccioná la salida')+'</small>';else if(popType==='zone')body=sel('Zona','zonePop',['Todas',...new Set(D.props.map(p=>p.zone))],d.zone);else body=popType==='pets'?step('pets','Cantidad de mascotas'):step('ad','Adultos')+step('kids','Menores');h.innerHTML=body+'<div class="btns">'+btn('Cerrar',"$('searchPop').hidden=true")+btn('Aplicar','saveSearchPop()','primary')+'</div>'}
function openSearchPop(k){const bar=$('compactBar'),active=document.activeElement;popType=k;let d=searchDraft();rangeStart=d.a;rangeEnd=d.b;rangeMonth=d.a.slice(0,7)+'-01';paintPop();const pop=$('searchPop');pop.style.left=Math.max(0,Math.min(bar.contains(active)?active.offsetLeft:0,bar.clientWidth-pop.offsetWidth))+'px'}
function saveSearchPop(){let d=searchDraft();if(popType==='dates'){if(!rangeEnd||nights(rangeStart,rangeEnd)>366)return toast('Elegí una estadía de 1 a 366 noches.');d.a=rangeStart;d.b=rangeEnd}else if(popType==='zone')d.zone=$('searchPop').querySelector('select').value;else for(let k of (popType==='pets'?['pets']:['ad','kids']))d[k]=+$('cnt'+k).textContent;$('searchPop').hidden=true;$('compactBar').innerHTML=barContent()}
function appliedChips(){let s=search;return [nights(s.a,s.b)+' noches',(s.ad+s.kids)+' huéspedes',s.pets?s.pets+' mascotas':'',s.zone!=='Todas'?s.zone:'',...s.amen,...[['total','Total hasta USD '],['minTotal','Total desde USD '],['night','Noche hasta USD '],['minNight','Noche desde USD '],['rooms','Habitaciones mín. '],['sea','Distancia máxima (m) ']].filter(([k])=>s[k]).map(([k,l])=>l+num(s[k]))].filter(Boolean).map(pill).join(' ')}
function searchTop(cal){return '<div class="searchWrap"><div class="compactBar" id="compactBar">'+barContent()+'</div><div hidden id="searchPop" class="searchPop"></div></div><div class="between bar"><div class="row">'+btn(ic('settings')+'Más filtros','moreFilters()')+appliedChips()+'</div>'+(cal?'':tabs(['Tarjetas','Calendario'],search.view,'switchView'))+'</div>'}
function ratesHub(){
 const links=[['cash','Planes de tarifa'],['cal','Calendario'],['search','Buscador de disponibilidad'],['sync','Sincronizar calendario']];
 return '<p class="hubSub">Gestión de precios, disponibilidad y sincronización de calendarios</p><section class="hub">'+links.map(([icon,label])=>label==='Buscador de disponibilidad'?btn(ic(icon)+e(label),"go('Disponibilidad')",'hubTile'):'<div class="hubTile">'+ic(icon)+e(label)+'</div>').join('')+'</section>';
}
function detailLayout(p){let a=prop(p),s=search,opt=options(p),q=quote(a,s.a,s.b,s.pets,opt.garage),ok=!blocked(p,s.a,s.b);let photos=[a.img,...(a.photos||galleryPhotos)].filter(Boolean);return '<div class="between bar">'+btn('‹ Volver a resultados','closeModal()','quiet')+'<div class="tabbar">'+['USD','ARS'].map(c=>btn(c==="ARS"?'Pesos (ARS)':c,'unit='+JSON.stringify(c)+';quoteDetail('+p+')',unit===c?'active':'')).join('')+'</div></div><div class="quoteLayout"><section class="box"><h2>Departamento '+e(a.name)+'</h2><p>'+e(a.zone)+' · Mar del Plata</p><div class="gallery">'+photos.slice(0,3).map((src,i)=>'<button type="button" class="g'+i+'" aria-label="Ampliar foto '+(i+1)+'" onclick="photoView('+p+','+i+')"><img src="'+src+'" alt="Interior de muestra"></button>').join('')+'</div><b>Hasta '+a.cap+' huéspedes · '+a.rooms+' ambientes</b><p>'+e(a.amen.join(' · '))+'</p></section><section class="box"><h2>Cotización de estadía</h2>'+'<div class="datePair"><div>'+ic('cal')+' Entrada<b>'+longDate(s.a)+'</b></div><div>'+ic('cal')+' Salida<b>'+longDate(s.b)+'</b></div></div>'+kv('Ocupación',quantity(s.ad,'adulto','adultos')+' · '+quantity(s.kids,'menor','menores')+' · '+quantity(s.pets,'mascota','mascotas'))+quoteInfo(q,nights(s.a,s.b))+kv('Depósito reembolsable',viewMoney(a.guarantee??100))+kv('Cambio de referencia','USD 1 = ARS '+num(D.rate))+(a.amen.includes('Cochera')?tick('Contratar cochera · '+viewMoney(a.charges.garage),'detailGarage',opt.garage,'onchange="options('+p+').garage=this.checked;quoteDetail('+p+')"'):'')+sel('Seña para reservar','detailPercent',[[10,'10 %'],[20,'20 %']],opt.percent,'onchange="options('+p+').percent=Number(this.value);quoteDetail('+p+')"')+kv('Seña solicitada',viewMoney(Math.ceil(q.total*opt.percent/100)))+pill(ok?'Disponible para las fechas seleccionadas':'Disponibilidad parcial u ocupada')+'<div class="stack bar">'+(ok?btn('Copiar cotización','copyProposal('+p+')')+btn('Reservar','openExistingReservation('+p+')','primary'):'<button type="button" disabled>Reservar</button>')+'</div></section></div>'}
// Integración: el sitio anfitrión debe atender este evento y abrir su formulario existente.
// preventDefault() confirma que el sitio recibió la solicitud.
function openExistingReservation(id){
 const p=prop(id),s=search,opt=options(id);
 if(blocked(id,s.a,s.b)){toast('Las fechas ya están ocupadas.');return}
 const costs=quote(p,s.a,s.b,s.pets,opt.garage),depositPercent=opt.percent;
 const detail={propertyId:id,property:p.name,checkIn:s.a,checkOut:s.b,nights:nights(s.a,s.b),
 adults:s.ad,children:s.kids,guests:s.ad+s.kids,pets:s.pets,garage:opt.garage,costsUSD:costs,
 stayTotalUSD:costs.total-costs.park,nightlyAverageUSD:(costs.total-costs.park)/nights(s.a,s.b),
 totalUSD:costs.total,guaranteeUSD:p.guarantee??100,depositPercent,agreedTotalUSD:opt.agreed??costs.total,
 requestedDepositUSD:Math.ceil(costs.total*depositPercent/100),displayCurrency:unit,arsPerUSD:D.rate};
 const receipt=new CustomEvent('checkandpoint:abrir-reserva',{cancelable:true,detail});
 if(window.dispatchEvent(receipt))$('error').textContent='Datos preparados. La apertura del formulario requiere conectar este botón con la web de Reservas.';
}
function photoView(p,i){let a=prop(p),list=[a.img,...(a.photos||galleryPhotos)];modal(a.name,img(list[i],'doc'),null,'',()=>quoteDetail(p))}
function quoteDetail(p){modal('Detalle del alojamiento',detailLayout(p));dlg.classList.add('reservePage')}


function restore(target,snapshot){if(Array.isArray(target)&&Array.isArray(snapshot)){target.length=snapshot.length}for(let k of Object.keys(target))if(!(k in snapshot))delete target[k];for(let [k,v] of Object.entries(snapshot)){if(v&&typeof v==='object'&&target[k]&&typeof target[k]==='object'&&Array.isArray(v)===Array.isArray(target[k]))restore(target[k],v);else target[k]=v}}
init();setInterval(()=>{if(!user||dlg.open||document.hidden)return;let before=D.rs.filter(r=>r.status==='Pendiente').length;expire();if(before!==D.rs.filter(r=>r.status==='Pendiente').length){commit().then(render).catch(()=>toast('Actualizá la vista para revisar las pendientes.'))}},30000);
</script></body></html>
