<VirtualHost *:80>
    ServerName checkandhome.com.ar
    ServerAlias www.checkandhome.com.ar
    
    # Redirect HTTP to HTTPS
    Redirect permanent / https://checkandhome.com.ar/
</VirtualHost>

<VirtualHost *:443>
    ServerName checkandhome.com.ar
    ServerAlias www.checkandhome.com.ar
    
    DocumentRoot /sites/chech/checkandhome/public
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/checkandhome.com.ar/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/checkandhome.com.ar/privkey.pem
    
    # SSL Security
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Security Headers
    Header always set X-Frame-Options DENY
    Header always set X-Content-Type-Options nosniff
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Enable compression
    LoadModule deflate_module modules/mod_deflate.so
    <Location />
        SetOutputFilter DEFLATE
        SetEnvIfNoCase Request_URI \
            \.(?:gif|jpe?g|png)$ no-gzip dont-vary
        SetEnvIfNoCase Request_URI \
            \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
    </Location>
    
    # Proxy configuration for Next.js app
    ProxyRequests Off
    ProxyPreserveHost On
    
    # Main app proxy
    ProxyPass /_next/ http://127.0.0.1:3030/_next/
    ProxyPassReverse /_next/ http://127.0.0.1:3030/_next/
    
    ProxyPass /api/ http://127.0.0.1:3030/api/
    ProxyPassReverse /api/ http://127.0.0.1:3030/api/
    
    ProxyPass / http://127.0.0.1:3030/
    ProxyPassReverse / http://127.0.0.1:3030/
    
    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3030/$1" [P,L]
    
    # Static file caching
    <LocationMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header append Cache-Control "public"
    </LocationMatch>
    
    # Block access to sensitive files
    <FilesMatch "\.(env|json|lock|md)$">
        Require all denied
    </FilesMatch>
    
    <Directory "/sites/chech/checkandhome">
        AllowOverride All
        Require all granted
    </Directory>
    
    # Logs
    ErrorLog /var/log/apache2/checkandhome-error.log
    CustomLog /var/log/apache2/checkandhome-access.log combined
    LogLevel warn
</VirtualHost>