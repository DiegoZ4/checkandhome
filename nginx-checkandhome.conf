server {
    listen 80;
    server_name checkandhome.com.ar www.checkandhome.com.ar;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name checkandhome.com.ar www.checkandhome.com.ar;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/checkandhome.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkandhome.com.ar/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Client max body size
    client_max_body_size 50M;

    # Root directory for static files
    root /sites/chech/checkandhome;

    # Main proxy to Next.js application
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Handle Next.js static assets
    location /_next/static/ {
        alias /sites/chech/checkandhome/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle public assets
    location /static/ {
        alias /sites/chech/checkandhome/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle favicon and robots
    location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        root /sites/chech/checkandhome/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ ^/(\.env|ecosystem\.config\.js|package\.json|package-lock\.json)$ {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/checkandhome-access.log;
    error_log /var/log/nginx/checkandhome-error.log;
}